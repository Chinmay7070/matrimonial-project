server:
  port: 8082
spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:mysql://localhost:3306/profile_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Chinmay@1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
